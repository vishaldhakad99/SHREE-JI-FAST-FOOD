services:
  # 1. Backend REST API Web Service
  - type: web
    name: shreeji-fastfood-api
    env: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: COOKIE_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://shreeji-fastfood.onrender.com
      - key: INITIAL_ADMIN_EMAIL
        value: admin@shreejifastfood.com
      - key: INITIAL_ADMIN_PASSWORD
        sync: false # Set in Render Dashboard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # 2. Frontend React / Vite Static Site
  - type: static
    name: shreeji-fastfood-web
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://shreeji-fastfood-api.onrender.com/api
